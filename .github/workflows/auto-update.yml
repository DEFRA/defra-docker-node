name: AUTO-UPDATE

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check for updates
        id: update
        run: python3 .github/scripts/update-matrix.py

      - name: Generate GitHub App token
        if: steps.update.outputs.updated == 'true'
        id: generate-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Render PR template
        if: steps.update.outputs.updated == 'true'
        id: template
        uses: chuhlomin/render-template@a7c644e341797d050d1cb24332d83791b9a46dae # v1
        with:
          template: .github/pull_request_template.md

      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: update-node-base-image
          base: main
          title: ${{ steps.update.outputs.title }}
          body: |
            Updates the Node.js base images, npm and the pinned base image digests:

            ${{ steps.update.outputs.body }}

            ${{ steps.template.outputs.result }}
          sign-commits: true
          commit-message: ${{ steps.update.outputs.title }}
          team-reviewers: ${{ vars.PR_REVIEW_TEAM }}

      # The vulnerability gate is a required check, so this merges only once the
      # updated image scans clean under vulnerability-policy.yml.
      - name: Enable auto-merge
        if: steps.update.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --squash
