name: AUTO-UPDATE

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Fetch latest Node.js versions
        run: |
          curl -s https://nodejs.org/dist/index.json > node_versions.json
          echo "Fetched latest Node.js versions."

      - name: Check for updates
        id: check-updates
        run: |
          latest_versions=$(jq -r '[.[] | {major: (.version | ltrimstr("v") | split(".")[0] | tonumber), version: (.version | ltrimstr("v"))}] | group_by(.major) | map({(.[0].major | tostring): .[0].version}) | add' node_versions.json)

          jq -c '.[]' image-matrix.json | while read -r entry; do
            current_version=$(echo "$entry" | jq -r '.nodeVersion')
            major_version=$(echo "$current_version" | cut -d. -f1)
            latest_version=$(echo "$latest_versions" | jq -r --arg major "$major_version" '.[$major]')
            alpine_version=$(echo "$entry" | jq -r '.alpineVersion')

            # Check if the Alpine image exists
            image="node:${latest_version}-alpine${alpine_version}"
            if [[ "$latest_version" != "$current_version" ]]; then
              if docker pull "$image" &>/dev/null; then
                echo "Update needed for Node.js $major_version: $current_version -> $latest_version"
                echo "$major_version:$latest_version:$alpine_version" >> updates.txt
              fi
            else
              echo "Alpine image $image not available. Skipping update for Node.js $major_version."
            fi
          done

          # Check if updates.txt exists and is not empty
          if [[ -s updates.txt ]]; then
            echo "node_update=true" >> $GITHUB_ENV
          else
            echo "node_update=false" >> $GITHUB_ENV
          fi

      - name: Check for npm update
        run: |
          current_npm=$(grep -oP 'NPM_VERSION=\K[\d.]+' JOB.env)
          latest_npm=$(curl -s https://registry.npmjs.org/npm/latest | jq -r '.version')

          if [[ "$latest_npm" != "$current_npm" && -n "$latest_npm" && "$latest_npm" != "null" ]]; then
            echo "npm update needed: $current_npm -> $latest_npm"
            echo "npm_update=true" >> $GITHUB_ENV
            echo "latest_npm=$latest_npm" >> $GITHUB_ENV
          else
            echo "npm_update=false" >> $GITHUB_ENV
          fi

      - name: Determine whether an update is required
        run: |
          if [[ "$node_update" == "true" || "$npm_update" == "true" ]]; then
            echo "update_needed=true" >> $GITHUB_ENV
          else
            echo "update_needed=false" >> $GITHUB_ENV
          fi

      - name: Update files
        if: env.update_needed == 'true'
        run: |
          # A new base image or npm release always produces a new Defra image version.
          current_defra_version=$(grep -oP 'DEFRA_VERSION=\K[\d.]+' JOB.env)
          new_defra_version=$(echo "$current_defra_version" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "s/DEFRA_VERSION=.*/DEFRA_VERSION=${new_defra_version}/" JOB.env
          echo "Bumped Defra version ${current_defra_version} -> ${new_defra_version}"

          # Apply any Node.js version bumps to the matrix and README.
          if [[ "$node_update" == "true" ]]; then
            while IFS=: read -r major_version latest_version alpine_version; do
              sed -i "s/\"nodeVersion\": \"${major_version}\.[^\"]*\"/\"nodeVersion\": \"${latest_version}\"/" image-matrix.json
              sed -i -E "s/\\|[[:space:]]*${major_version}\\.[[:digit:]]*\\.[[:digit:]]*[[:space:]]*\\|[[:space:]]*${major_version}\\.[[:digit:]]*\\.[[:digit:]]*-alpine[[:digit:]]*\\.[[:digit:]]*[[:space:]]*\\|/| ${latest_version}       | ${latest_version}-alpine${alpine_version} |/" README.md
            done < updates.txt
            echo "Updated image-matrix.json and README.md"
          fi

          # Apply any npm bump to JOB.env and the Dockerfile.
          if [[ "$npm_update" == "true" ]]; then
            sed -i "s/NPM_VERSION=.*/NPM_VERSION=${latest_npm}/" JOB.env
            sed -i "s/ARG NPM_VERSION=.*/ARG NPM_VERSION=${latest_npm}/" Dockerfile
            echo "Updated npm to ${latest_npm}"
          fi

          # Point the Dockerfile and examples at the current latest image.
          latest_node_version=$(jq -r '.[] | select(.tags[] == "latest") | .nodeVersion' image-matrix.json)
          latest_alpine_version=$(jq -r '.[] | select(.tags[] == "latest") | .alpineVersion' image-matrix.json)
          sed -i "s/ARG BASE_VERSION=.*/ARG BASE_VERSION=${latest_node_version}-alpine${latest_alpine_version}/" Dockerfile
          sed -i "s/ARG DEFRA_VERSION=.*/ARG DEFRA_VERSION=${new_defra_version}/" Dockerfile
          sed -i "s/ARG PARENT_VERSION=.*/ARG PARENT_VERSION=${new_defra_version}-node${latest_node_version}/" examples/Dockerfile
          echo "Updated Dockerfile and examples"

      - name: Prepare pull request details
        id: pr-details
        if: env.update_needed == 'true'
        run: |
          body=""
          if [[ "$node_update" == "true" ]]; then
            body=$(cat updates.txt | awk -F: '{print "- Node " $1 ": " $2}')
          fi
          if [[ "$npm_update" == "true" ]]; then
            body="${body}"$'\n'"- npm: ${latest_npm}"
          fi

          updated_versions=""
          if [[ "$node_update" == "true" ]]; then
            updated_versions=$(cat updates.txt | awk -F: '{print $1}' | sort -u | paste -sd, -)
          fi
          if [[ "$npm_update" == "true" ]]; then
            updated_versions="${updated_versions:+$updated_versions,}npm"
          fi

          echo "pull_request_title=Update base image: ${updated_versions}" >> $GITHUB_ENV
          echo "pull_request_branch=update-base-image-${updated_versions//,/-}" >> $GITHUB_ENV
          echo "pull_request_body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Prepared pull request details."

      - name: Clean up temporary files
        if: env.update_needed == 'true'
        run: |
          rm -f node_versions.json updates.txt
          echo "Removed temporary files."

      - name: Generate GitHub App token
        if: env.update_needed == 'true'
        id: generate-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Render PR template
        if: env.update_needed == 'true'
        id: template
        uses: chuhlomin/render-template@a7c644e341797d050d1cb24332d83791b9a46dae # v1
        with:
          template: .github/pull_request_template.md

      - name: Create pull request
        id: create-pr
        if: env.update_needed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: ${{ env.pull_request_branch }}
          base: main
          title: ${{ env.pull_request_title }}
          body: |
            Updates the Node.js base images to the latest versions:
            ${{ steps.pr-details.outputs.pull_request_body }}
            ${{ steps.template.outputs.result }}
          sign-commits: true
          commit-message: ${{ env.pull_request_title }}
          team-reviewers: ${{ vars.PR_REVIEW_TEAM }}

      # Queues the PR to merge automatically once the required scan check passes and a
      # reviewer approves. Unfixable vulnerabilities no longer block, so most updates
      # only wait on a single approval.
      - name: Enable auto-merge
        if: env.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash

