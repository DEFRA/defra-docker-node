name: NIGHTLY-SCAN

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  get-matrix-values:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.set-var.outputs.image }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - id: set-var
        run: |
          echo 'image<<EOF' >> $GITHUB_OUTPUT
          cat ./image-matrix.json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs:  get-matrix-values
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJSON(needs.get-matrix-values.outputs.image)}}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set job environment variables
        run:  cat JOB.env >> $GITHUB_ENV

      # Scanners report only; vulnerability-policy.yml decides what counts as a problem.
      - name: Run Anchore Grype scan
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: defradigital/${{env.IMAGE_NAME}}:${{env.DEFRA_VERSION}}-node${{matrix.image.nodeVersion}}
          fail-build: false
          output-format: json
          by-cve: true
          cache-db: true

      - name: Run Aqua Trivy scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: defradigital/${{env.IMAGE_NAME}}:${{env.DEFRA_VERSION}}-node${{matrix.image.nodeVersion}}
          format: json
          output: trivy-node-${{ matrix.image.nodeVersion }}.json
          exit-code: 0
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Apply vulnerability policy
        id: gate
        continue-on-error: true
        run: |
          pip install --quiet pyyaml
          python3 .github/scripts/scan-gate.py \
            --grype "${{ steps.grype-scan.outputs.json }}" \
            --trivy trivy-node-${{ matrix.image.nodeVersion }}.json \
            --image "defradigital/${{env.IMAGE_NAME}}:${{env.DEFRA_VERSION}}-node${{matrix.image.nodeVersion}}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --sarif gate-node-${{ matrix.image.nodeVersion }}.sarif \
            --json gate-node-${{ matrix.image.nodeVersion }}.json

      - name: Upload policy results to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: gate-node-${{ matrix.image.nodeVersion }}.sarif
          category: nightly-node-${{ matrix.image.nodeVersion }}

      - name: Build issue section
        if: ${{ steps.gate.outcome == 'failure' }}
        run: |
          {
            echo "### node ${{ matrix.image.nodeVersion }}"
            echo
            echo "Image: \`defradigital/${{env.IMAGE_NAME}}:${{env.DEFRA_VERSION}}-node${{matrix.image.nodeVersion}}\`"
            echo
            echo "| Severity | ID | Package | Installed | Fixed in |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.blocking[] | "| \(.severity) | \(.ident) | \(.package) | \(.version) | \(.fix_versions // "-") |"' \
              gate-node-${{ matrix.image.nodeVersion }}.json
            echo
          } > issue-section-${{ matrix.image.nodeVersion }}.md

      - name: Upload issue section
        if: ${{ steps.gate.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-section-${{ matrix.image.nodeVersion }}
          path: issue-section-${{ matrix.image.nodeVersion }}.md

  raise-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: scan
    if: always()
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Collect findings
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: issue-section-*
          merge-multiple: true
          path: sections

      - name: Assemble issue body
        id: body
        run: |
          if ! ls sections/*.md >/dev/null 2>&1; then
            echo "has_findings=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          {
            echo "The nightly scan found vulnerabilities that block under \`vulnerability-policy.yml\`."
            echo
            echo "These do **not** block rebuilds of \`main\`. Resolve by bumping the base image, npm,"
            echo "or an Alpine package. Add an exception to \`vulnerability-policy.yml\` only as a last resort."
            echo
            cat sections/*.md
            echo
            echo "[View the scan run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > issue-body.md

          echo "has_findings=true" >> $GITHUB_OUTPUT

      - name: Open or update issue
        if: ${{ steps.body.outputs.has_findings == 'true' }}
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: "Nightly scan: vulnerabilities require attention"
          content-filepath: issue-body.md
          labels: security, nightly-scan

      - name: Close issue when clean
        if: ${{ steps.body.outputs.has_findings != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label nightly-scan --state open --json number --jq '.[].number' \
            | while read -r number; do
                [ -n "$number" ] || continue
                gh issue close "$number" --comment "Nightly scan is clean; closing automatically."
              done
